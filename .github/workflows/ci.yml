name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # expo-env.d.ts is generated by `expo start` and git-ignored; the type
      # check needs it for Expo's declarations (e.g. CSS imports on web).
      - name: Create Expo type references
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci
